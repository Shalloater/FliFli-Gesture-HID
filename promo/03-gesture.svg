<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#e6f5ff"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fafdff"/><stop offset="1" stop-color="#e6f6ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1485cc" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1080" height="1440" fill="url(#bg)"/>
  <text x="80" y="130" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" fill="#087ddd" letter-spacing="4">03 / GESTURE</text>
  <text x="80" y="230" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="62" font-weight="700" fill="#102944">指尖手势，多种输入</text>
  <text x="80" y="300" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" fill="#52708f">点按、滑动、画圈，都能绑定你需要的动作</text>
  <g filter="url(#shadow)">
    <rect x="80" y="410" width="920" height="310" rx="38" fill="url(#panel)" stroke="#c6eafa" stroke-width="3"/>
    <rect x="80" y="760" width="440" height="450" rx="38" fill="url(#panel)" stroke="#c6eafa" stroke-width="3"/>
    <rect x="560" y="760" width="440" height="450" rx="38" fill="url(#panel)" stroke="#c6eafa" stroke-width="3"/>
  </g>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#173754">
    <text x="130" y="475" font-size="28" font-weight="600">多指点按</text>
    <text x="130" y="520" font-size="23" fill="#68849d">单击 · 双击 · 三击</text>
    <circle cx="430" cy="630" r="34" fill="#20adeb"/><circle cx="540" cy="630" r="34" fill="#20adeb"/><circle cx="650" cy="630" r="34" fill="#20adeb"/>
    <path d="M430 590 V550 M540 590 V550 M650 590 V550" stroke="#64cbf5" stroke-width="14" stroke-linecap="round"/>
    <text x="130" y="825" font-size="28" font-weight="600">方向滑动</text>
    <text x="130" y="870" font-size="23" fill="#68849d">上下左右，交给手指表达</text>
    <path d="M300 1060 L300 925 M245 980 L300 925 L355 980" fill="none" stroke="#0b8fe1" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M300 1105 L300 1170 M245 1115 L300 1170 L355 1115" fill="none" stroke="#64cbf5" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="610" y="825" font-size="28" font-weight="600">画圈手势</text>
    <text x="610" y="870" font-size="23" fill="#68849d">顺时针与逆时针，自定义触发</text>
    <!-- Circular arc and rounded arrow, following the supplied refresh symbol. -->
    <path d="M883 1047 A103 103 0 1 1 852.83 974.17" fill="none" stroke="#0b8fe1" stroke-width="22" stroke-linecap="round"/>
    <path d="M806 974.17 H852.83 V927" fill="none" stroke="#0b8fe1" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M80 1320 C280 1210 420 1260 570 1325 C720 1390 850 1380 1000 1290" fill="none" stroke="#2db7ef" stroke-width="22" stroke-linecap="round" opacity=".45"/>
</svg>
