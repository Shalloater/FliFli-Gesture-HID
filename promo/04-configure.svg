    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12324f"/><stop offset="1" stop-color="#0b79c9"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1485cc" flood-opacity=".18"/></filter>
