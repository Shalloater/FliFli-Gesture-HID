    <text x="275" y="770" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" fill="#173754">上滑 · Page Down</text>
    <rect x="160" y="838" width="760" height="92" rx="24" fill="#f1f9ff" stroke="#d1ecfb" stroke-width="2"/>
