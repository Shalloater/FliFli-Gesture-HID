<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" role="img" aria-labelledby="tap-3-3-left-title tap-3-3-left-desc" data-demo="tap:3:3:left"><title id="tap-3-3-left-title">三指三击 · 左半屏</title><desc id="tap-3-3-left-desc">在左半屏范围内，用三根手指一起轻点 3 次，每次都抬起。 动画为教学慢放，实心触点表示按下，触点淡出表示抬起。</desc><style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif} .accent{fill:var(--accent,#604985)} .trace{stroke:var(--soft,#d5c7f2)} .soft{fill:var(--soft,#d5c7f2)}</style><defs><marker id="tap-3-3-left-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="var(--soft,#d5c7f2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="240" y="30" text-anchor="middle" fill="#778198" font-size="12" letter-spacing="1.2">本机 · 触发动作</text><rect x="93" y="77" width="294" height="398" rx="23" fill="#e9edf3" stroke="#dbe1e9"/><rect x="105" y="96" width="270" height="360" rx="9" fill="#171b25" stroke="#cfd6e1"/><rect x="221" y="85" width="38" height="3" rx="1.5" fill="#c3cad7"/><rect x="106" y="97" width="133" height="358" rx="7" class="soft" opacity=".13"/><path d="M 240 96 V 456" stroke="#a6a1bd" stroke-dasharray="4 5" opacity=".5"/><text x="172.5" y="119" text-anchor="middle" fill="#c8c5dc" font-size="10">左半屏 · 有效区域</text><g class="contact" data-contact="1" transform="translate(142.8 276)"><animateTransform attributeName="transform" type="translate" values="142.8 276;142.8 276;142.8 276" keyTimes="0;0.1437;1" dur="3.2s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0875;0.1437;0.45;0.5187;1" dur="3.2s" repeatCount="indefinite" calcMode="linear"/><circle r="12" fill="white" class="trace" stroke-width="1.8" opacity=".7"/><g class="pressed"><animate attributeName="opacity" values="0;1;0;1;0;1;0;0" keyTimes="0;0.1437;0.2;0.2562;0.3125;0.3687;0.425;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/><circle r="23" class="soft" opacity=".33"/><circle r="11" class="accent"/><text y="4" fill="white" font-size="11" font-weight="600" text-anchor="middle">1</text></g></g><g class="contact" data-contact="2" transform="translate(172.5 276)"><animateTransform attributeName="transform" type="translate" values="172.5 276;172.5 276;172.5 276" keyTimes="0;0.1437;1" dur="3.2s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0875;0.1437;0.45;0.5187;1" dur="3.2s" repeatCount="indefinite" calcMode="linear"/><circle r="12" fill="white" class="trace" stroke-width="1.8" opacity=".7"/><g class="pressed"><animate attributeName="opacity" values="0;1;0;1;0;1;0;0" keyTimes="0;0.1437;0.2;0.2562;0.3125;0.3687;0.425;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/><circle r="23" class="soft" opacity=".33"/><circle r="11" class="accent"/><text y="4" fill="white" font-size="11" font-weight="600" text-anchor="middle">2</text></g></g><g class="contact" data-contact="3" transform="translate(202.2 276)"><animateTransform attributeName="transform" type="translate" values="202.2 276;202.2 276;202.2 276" keyTimes="0;0.1437;1" dur="3.2s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0875;0.1437;0.45;0.5187;1" dur="3.2s" repeatCount="indefinite" calcMode="linear"/><circle r="12" fill="white" class="trace" stroke-width="1.8" opacity=".7"/><g class="pressed"><animate attributeName="opacity" values="0;1;0;1;0;1;0;0" keyTimes="0;0.1437;0.2;0.2562;0.3125;0.3687;0.425;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/><circle r="23" class="soft" opacity=".33"/><circle r="11" class="accent"/><text y="4" fill="white" font-size="11" font-weight="600" text-anchor="middle">3</text></g></g><text x="240" y="498" fill="#69758b" font-size="12" text-anchor="middle">同组触点一起操作</text><text x="240" y="61" text-anchor="middle" class="accent" font-size="15" font-weight="600" opacity="0">第 1 次轻点<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1437;0.2;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/></text><text x="240" y="61" text-anchor="middle" class="accent" font-size="15" font-weight="600" opacity="0">抬起全部手指<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.2;0.25;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/></text><text x="240" y="61" text-anchor="middle" class="accent" font-size="15" font-weight="600" opacity="0">第 2 次轻点<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.2562;0.3125;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/></text><text x="240" y="61" text-anchor="middle" class="accent" font-size="15" font-weight="600" opacity="0">抬起全部手指<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.3125;0.3625;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/></text><text x="240" y="61" text-anchor="middle" class="accent" font-size="15" font-weight="600" opacity="0">第 3 次轻点<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.3687;0.425;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/></text><text x="240" y="61" text-anchor="middle" class="accent" font-size="15" font-weight="600" opacity="0">抬起全部手指<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.425;0.475;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/></text><text x="240" y="61" text-anchor="middle" class="accent" font-size="15" font-weight="600" opacity="0">等待下一轮<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.5812;0.9844;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/></text></svg>