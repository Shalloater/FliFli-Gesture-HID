<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" role="img" aria-labelledby="motion-1-swipe-right-title motion-1-swipe-right-desc" data-demo="motion:1:swipe_right"><title id="motion-1-swipe-right-title">单指右滑</title><desc id="motion-1-swipe-right-desc">一根手指按下后一起右滑，到达终点后全部抬起。 动画为教学慢放，实心触点表示按下，触点淡出表示抬起。</desc><style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif} .accent{fill:var(--accent,#604985)} .trace{stroke:var(--soft,#d5c7f2)} .soft{fill:var(--soft,#d5c7f2)}</style><defs><marker id="motion-1-swipe-right-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="var(--soft,#d5c7f2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="240" y="30" text-anchor="middle" fill="#778198" font-size="12" letter-spacing="1.2">本机 · 触发动作</text><rect x="93" y="77" width="294" height="398" rx="23" fill="#e9edf3" stroke="#dbe1e9"/><rect x="105" y="96" width="270" height="360" rx="9" fill="#171b25" stroke="#cfd6e1"/><rect x="221" y="85" width="38" height="3" rx="1.5" fill="#c3cad7"/><rect x="106" y="97" width="268" height="358" rx="7" class="soft" opacity=".13"/><text x="240" y="119" text-anchor="middle" fill="#c8c5dc" font-size="10">全屏 · 有效区域</text><path d="M 169.8 276 L 310.2 276" class="trace" fill="none" opacity=".24" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#motion-1-swipe-right-arrow)"/><path d="M 169.8 276 L 310.2 276" class="trace" fill="none" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;1;0;0;1" keyTimes="0;0.1437;0.4688;0.9844;1" dur="3.2s" repeatCount="indefinite" calcMode="linear"/></path><circle cx="169.8" cy="276" r="4" fill="white" class="trace" stroke-width="2"/><g class="contact" data-contact="1" transform="translate(169.8 276)"><animateTransform attributeName="transform" type="translate" values="169.8 276;169.8 276;310.2 276;310.2 276" keyTimes="0;0.1437;0.4688;1" dur="3.2s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0875;0.1437;0.5375;0.6062;1" dur="3.2s" repeatCount="indefinite" calcMode="linear"/><circle r="12" fill="white" class="trace" stroke-width="1.8" opacity=".7"/><g class="pressed"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1437;0.5125;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/><circle r="23" class="soft" opacity=".33"/><circle r="11" class="accent"/><text y="4" fill="white" font-size="11" font-weight="600" text-anchor="middle">1</text></g></g><text x="240" y="498" fill="#69758b" font-size="12" text-anchor="middle">实心触点为按下，淡出为抬起</text><text x="240" y="61" text-anchor="middle" class="accent" font-size="15" font-weight="600" opacity="0">准备<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.0375;0.1437;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/></text><text x="240" y="61" text-anchor="middle" class="accent" font-size="15" font-weight="600" opacity="0">一起按下<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1437;0.2062;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/></text><text x="240" y="61" text-anchor="middle" class="accent" font-size="15" font-weight="600" opacity="0">沿箭头滑动<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.2062;0.4688;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/></text><text x="240" y="61" text-anchor="middle" class="accent" font-size="15" font-weight="600" opacity="0">全部抬起<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.5125;0.6562;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/></text><text x="240" y="61" text-anchor="middle" class="accent" font-size="15" font-weight="600" opacity="0">等待下一轮<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.6687;0.9844;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/></text></svg>