<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" role="img" aria-labelledby="touch-double-tap-title touch-double-tap-desc" data-demo="touch_double_tap"><title id="touch-double-tap-title">屏幕中心双击</title><desc id="touch-double-tap-desc">在受控屏幕中心连续点击两次，每次按下后抬起。 动画为教学慢放，实心触点表示按下，触点淡出表示抬起。</desc><style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif} .accent{fill:var(--accent,#604985)} .trace{stroke:var(--accent,#604985)} .soft{fill:var(--soft,#d5c7f2)}</style><defs><marker id="touch-double-tap-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="var(--accent,#604985)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="240" y="30" text-anchor="middle" fill="#778198" font-size="12" letter-spacing="1.2">受控端 · 触控信号</text><rect x="93" y="77" width="294" height="398" rx="23" fill="#e9edf3" stroke="#dbe1e9"/><rect x="105" y="96" width="270" height="360" rx="9" fill="#ffffff" stroke="#cfd6e1"/><rect x="221" y="85" width="38" height="3" rx="1.5" fill="#c3cad7"/><path d="M132 139 H256 M132 155 H330 M132 171 H309" fill="none" stroke="#edf0f5" stroke-width="5" stroke-linecap="round"/><path d="M132 410 H230 M132 426 H305" fill="none" stroke="#edf0f5" stroke-width="5" stroke-linecap="round"/><g class="contact" data-contact="1" transform="translate(240.0041 276.0055)"><animateTransform attributeName="transform" type="translate" values="240.0041 276.0055;240.0041 276.0055;240.0041 276.0055" keyTimes="0;0.1437;1" dur="3.2s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0875;0.1437;0.3937;0.4625;1" dur="3.2s" repeatCount="indefinite" calcMode="linear"/><circle r="12" fill="white" class="trace" stroke-width="1.8" opacity=".7"/><g class="pressed"><animate attributeName="opacity" values="0;1;0;1;0;0" keyTimes="0;0.1437;0.2;0.3125;0.3687;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/><circle r="23" class="soft" opacity=".33"/><circle r="11" class="accent"/><circle r="3" fill="white"/></g></g><text x="240" y="498" fill="#69758b" font-size="12" text-anchor="middle">实心触点为按下，淡出为抬起</text><text x="240" y="61" text-anchor="middle" class="accent" font-size="15" font-weight="600" opacity="0">第 1 次按下<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1437;0.2;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/></text><text x="240" y="61" text-anchor="middle" class="accent" font-size="15" font-weight="600" opacity="0">抬起<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.2;0.2781;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/></text><text x="240" y="61" text-anchor="middle" class="accent" font-size="15" font-weight="600" opacity="0">第 2 次按下<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.3125;0.3687;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/></text><text x="240" y="61" text-anchor="middle" class="accent" font-size="15" font-weight="600" opacity="0">抬起<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.3687;0.4469;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/></text><text x="240" y="61" text-anchor="middle" class="accent" font-size="15" font-weight="600" opacity="0">等待下一轮<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.525;0.9844;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/></text></svg>