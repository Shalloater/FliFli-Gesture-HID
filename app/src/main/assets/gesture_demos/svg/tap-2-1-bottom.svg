<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" role="img" aria-labelledby="tap-2-1-bottom-title tap-2-1-bottom-desc" data-demo="tap:2:1:bottom"><title id="tap-2-1-bottom-title">双指单击 · 下半屏</title><desc id="tap-2-1-bottom-desc">在下半屏范围内，用两根手指一起轻点 1 次，每次都抬起。 动画为教学慢放，实心触点表示按下，触点淡出表示抬起。</desc><style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif} .accent{fill:var(--accent,#604985)} .trace{stroke:var(--soft,#d5c7f2)} .soft{fill:var(--soft,#d5c7f2)}</style><defs><marker id="tap-2-1-bottom-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="var(--soft,#d5c7f2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="240" y="30" text-anchor="middle" fill="#778198" font-size="12" letter-spacing="1.2">本机 · 触发动作</text><rect x="93" y="77" width="294" height="398" rx="23" fill="#e9edf3" stroke="#dbe1e9"/><rect x="105" y="96" width="270" height="360" rx="9" fill="#171b25" stroke="#cfd6e1"/><rect x="221" y="85" width="38" height="3" rx="1.5" fill="#c3cad7"/><rect x="106" y="277" width="268" height="178" rx="7" class="soft" opacity=".13"/><path d="M 105 276 H 375" stroke="#a6a1bd" stroke-dasharray="4 5" opacity=".5"/><text x="240" y="299" text-anchor="middle" fill="#c8c5dc" font-size="10">下半屏 · 有效区域</text><g class="contact" data-contact="1" transform="translate(219.75 366)"><animateTransform attributeName="transform" type="translate" values="219.75 366;219.75 366;219.75 366" keyTimes="0;0.1437;1" dur="3.2s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0875;0.1437;0.225;0.2937;1" dur="3.2s" repeatCount="indefinite" calcMode="linear"/><circle r="12" fill="white" class="trace" stroke-width="1.8" opacity=".7"/><g class="pressed"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1437;0.2;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/><circle r="23" class="soft" opacity=".33"/><circle r="11" class="accent"/><text y="4" fill="white" font-size="11" font-weight="600" text-anchor="middle">1</text></g></g><g class="contact" data-contact="2" transform="translate(260.25 366)"><animateTransform attributeName="transform" type="translate" values="260.25 366;260.25 366;260.25 366" keyTimes="0;0.1437;1" dur="3.2s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0875;0.1437;0.225;0.2937;1" dur="3.2s" repeatCount="indefinite" calcMode="linear"/><circle r="12" fill="white" class="trace" stroke-width="1.8" opacity=".7"/><g class="pressed"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1437;0.2;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/><circle r="23" class="soft" opacity=".33"/><circle r="11" class="accent"/><text y="4" fill="white" font-size="11" font-weight="600" text-anchor="middle">2</text></g></g><text x="240" y="498" fill="#69758b" font-size="12" text-anchor="middle">同组触点一起操作</text><text x="240" y="61" text-anchor="middle" class="accent" font-size="15" font-weight="600" opacity="0">第 1 次轻点<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1437;0.2;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/></text><text x="240" y="61" text-anchor="middle" class="accent" font-size="15" font-weight="600" opacity="0">抬起全部手指<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.2;0.25;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/></text><text x="240" y="61" text-anchor="middle" class="accent" font-size="15" font-weight="600" opacity="0">等待下一轮<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.3563;0.9844;1" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/></text></svg>